name: Daily ICT Contest Alert Bot

on:
  schedule:
    # Asia/Seoul 08:00 AM = 23:00 UTC (previous day)
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      send_test_digest:
        description: '오늘 이미 보냈어도 요약 메시지 한 번 더 테스트 발송'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: contest-alert-workflow
  cancel-in-progress: false

jobs:
  alert:
    name: Collect Contests & Dispatch Discord Alerts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Refuse stale workflow re-runs
        run: |
          current_head="$(git rev-parse HEAD)"
          latest_head="$(git ls-remote --exit-code origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [ "$current_head" != "$latest_head" ]; then
            echo "::error::This run uses an old commit. Start a new run from Actions > Run workflow on the latest branch; do not use Re-run."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Contest Alert Bot
        id: bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_SEARCH_ENABLED: ${{ vars.GEMINI_SEARCH_ENABLED }}
          GEMINI_REFINE_ENABLED: ${{ vars.GEMINI_REFINE_ENABLED }}
          GEMINI_REFINE_MODEL: ${{ vars.GEMINI_REFINE_MODEL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TZ: "Asia/Seoul"
        run: |
          if [ "${{ inputs.send_test_digest }}" = "true" ]; then
            python main.py --send-test-digest
          else
            python main.py
          fi

      - name: Commit & Push Updated Contest State
        if: ${{ success() || steps.bot.outcome == 'failure' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Add only the data storage file
          git add data/contests.json

          # Check if there are staged changes
          if git diff --staged --quiet; then
            echo "No changes in data/contests.json. Skipping commit."
          else
            echo "Changes detected in data/contests.json. Committing and pushing..."
            git commit -m "chore(data): update contests.json [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          fi
